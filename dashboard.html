<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Edge Trading Journal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Dashboard</h1>
        <button id="logoutBtn">Logout</button>
    </header>
    <main>
        <section class="trade-entry">
            <h2>Add Trade</h2>
            <input type="date" id="tradeDate">
            <input type="number" id="entryPrice" placeholder="Entry Price">
            <input type="number" id="exitPrice" placeholder="Exit Price">
            <input type="text" id="notes" placeholder="Notes">
            <button id="addTradeBtn">Add Trade</button>
        </section>
        <section class="trade-list">
            <h2>Your Trades</h2>
            <table id="tradesTable">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Entry</th>
                        <th>Exit</th>
                        <th>P/L</th>
                        <th>Notes</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>
        <section class="charts">
            <h2>Analytics</h2>
            <canvas id="profitChart"></canvas>
            <canvas id="winRateChart"></canvas>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
