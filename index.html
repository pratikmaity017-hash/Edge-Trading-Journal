<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edge Trading Journal Pro</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">
    <div class="login-box">
        <h2>Login</h2>
        <input id="username" placeholder="Enter Username">
        <button onclick="login()">Login</button>
    </div>
</div>

<!-- APP -->

<input type="text" id="pair" placeholder="Trade Pair (e.g. BTC/USDT)">

<div id="app">

<h2>📊 Trading Journal</h2>

<div class="card">
    <h3>Add Trade</h3>
    <input type="date" id="date">
    <input type="number" id="entry" placeholder="Entry Price">
    <input type="number" id="exit" placeholder="Exit Price">
    <input type="number" id="qty" placeholder="Quantity">
    <input type="text" id="notes" placeholder="Trade Notes">
    <button onclick="addTrade()">Save Trade</button>
</div>

<div class="card grid grid-3">
    <div>
        <h4>Daily P&L</h4>
        <p id="daily"></p>
    </div>
    <div>
        <h4>Monthly P&L</h4>
        <p id="monthly"></p>
    </div>
    <div>
        <h4>Yearly P&L</h4>
        <p id="yearly"></p>
    </div>
</div>

<div class="card">
    <h3>Trades</h3>
    <div id="tradeList"></div>
</div>

<div class="card">
    <h3>📅 Calendar P&L</h3>
    <div class="calendar" id="calendar"></div>
</div>

</div>

<script src="script.js"></script>
</body>
</html>
